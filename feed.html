<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>ТУТУТИКТОК — тревел лента</title>
  <link rel="icon" type="image/png" href="assets/brand/tututiktok-badge-transparent.png" />
  <link rel="icon" type="image/svg+xml" href="assets/brand/favicon.svg" />
  <link rel="apple-touch-icon" href="assets/brand/tututiktok-badge-transparent.png" />
  <link rel="preload" href="assets/fonts/tutu-sans-regular.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="assets/fonts/tutu-sans-bold.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preconnect" href="https://kinescope.io" crossorigin />
  <link rel="preconnect" href="https://player.kinescope.io" crossorigin />
  <link rel="stylesheet" href="feed.css?v=45" />
</head>
<body>
  <main class="phone">
    <div class="frame">
      <div class="feed" id="feed" tabindex="0"></div>
      <header class="topbar">
        <p class="brand"><img src="assets/brand/tututiktok-logo.png" alt="ТУТУТИКТОК" /></p>
      </header>
      <div class="scrub">
        <div class="scrub-bar"><div class="scrub-fill" id="scrub"></div><input id="seek" class="seek" type="range" min="0" max="1000" value="0" aria-label="Перемотать видео" /></div>
      </div>
      <section class="offer-viewer" id="offer-viewer" hidden aria-label="Оффер">
        <div class="offer-viewer-bar">
          <button class="offer-viewer-close" id="offer-viewer-close" type="button" aria-label="Вернуться в ленту">×</button>
          <span class="offer-viewer-title">Оффер</span>
          <a class="offer-viewer-external" id="offer-viewer-external" href="#" target="_blank" rel="noopener noreferrer" aria-label="Открыть оффер отдельно">↗</a>
        </div>
        <iframe class="offer-viewer-frame" id="offer-viewer-frame" title="Оффер" src="about:blank"></iframe>
      </section>
      <p class="status" id="status" hidden></p>
      <button class="retry-button" id="retry" type="button" hidden>Повторить</button>
    </div>
  </main>
  <script>
    window.onKinescopeIframeAPIReady = window.onKinescopeIframeApiReady = function (factory) {
      window.__kinescopeFactory = factory;
      window.dispatchEvent(new Event("kinescope-ready"));
    };
  </script>
  <script async src="https://player.kinescope.io/latest/iframe.player.js"></script>
  <script src="feed-data.js?v=5"></script>
  <script src="feed.js?v=53"></script>
</body>
</html>
